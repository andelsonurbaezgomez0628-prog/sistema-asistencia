apply plugin: 'com.android.application'

def localSigningProperties = new Properties()
def localSigningPropertiesFile = new File(System.getProperty('user.home'), '.gradle/asistencia-signing.properties')
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}
def signingValue = { String envName, String propertyName ->
    System.getenv(envName) ?: localSigningProperties.getProperty(propertyName)
}
def releaseSigningValues = [
    storeFile: signingValue('ANDROID_KEYSTORE_FILE', 'storeFile'),
    storePassword: signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword'),
    keyAlias: signingValue('ANDROID_KEY_ALIAS', 'keyAlias'),
    keyPassword: signingValue('ANDROID_KEY_PASSWORD', 'keyPassword'),
]
def releaseSigningConfigured = releaseSigningValues.values().every { it }

android {
    namespace = "com.sistema.asistencia"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sistema.asistencia"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "servidor"
    productFlavors {
        render {
            dimension "servidor"
            applicationId "com.sistema.asistencia"
            resValue "string", "app_name", "Sistema Asistencia"
            resValue "string", "title_activity_main", "Sistema Asistencia"
            resValue "string", "package_name", "com.sistema.asistencia"
            resValue "string", "custom_url_scheme", "com.sistema.asistencia"
            manifestPlaceholders = [twaHost: "sistema-asistencia-2os4.onrender.com"]
        }
        hostless {
            dimension "servidor"
            applicationId "com.sistema.asistencia.hostless"
            resValue "string", "app_name", "Sistema Asistencia Hostless"
            resValue "string", "title_activity_main", "Sistema Asistencia Hostless"
            resValue "string", "package_name", "com.sistema.asistencia.hostless"
            resValue "string", "custom_url_scheme", "com.sistema.asistencia.hostless"
            manifestPlaceholders = [twaHost: "sistema-ineligente.hostless.app"]
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Firma debug y release usan claves distintas; separar sus IDs evita conflictos al instalar.
            applicationIdSuffix ".debug"
        }
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { tarea ->
    if (tarea.name in [
        'packageRenderRelease',
        'packageHostlessRelease',
        'bundleRenderRelease',
        'bundleHostlessRelease',
    ]) {
        tarea.doFirst {
            if (!releaseSigningConfigured) {
                throw new GradleException('Configura ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD para firmar las apps release.')
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
