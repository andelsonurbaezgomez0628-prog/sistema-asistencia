# Render Blueprint para Asistencia Escolar Inteligente.
# Al conectar el repositorio, Render crea el servicio con estos valores.
# DATABASE_URL y SESSION_SECRET se piden una sola vez y no se guardan en Git.
services:
  - type: web
    name: sistema-asistencia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
