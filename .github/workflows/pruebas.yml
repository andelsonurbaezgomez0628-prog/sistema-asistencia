# ==============================================================
# .github/workflows/pruebas.yml
# --------------------------------------------------------------
# Pruebas y ejecutables: cada cambio revisa el codigo y compila APK debug
# de los dos servidores para descargarlos como artefactos desde la ejecucion.
#
#   1) Revisar sintaxis JavaScript y plantillas
#   2) Ejecutar pruebas del algoritmo y del parser SQL
#
# Si algo falla, el commit aparece en rojo en GitHub y el equipo se
# entera antes de la demostracion. Cuesta cero y se ve profesional ante
# el jurado: "el codigo se prueba solo en cada cambio".
#
# La compilacion debug no usa claves privadas de firma. Las versiones de
# produccion requieren las claves privadas protegidas del proyecto.
# ==============================================================

name: Pruebas y ejecutables Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      # 1) Descargar el codigo del repositorio
      - name: Bajar el codigo
        uses: actions/checkout@v7

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Revisar sintaxis
        run: npm run check

      - name: Ejecutar pruebas
        run: npm test

  compilar-apk:
    name: Compilar APK para Render y Hostless
    needs: revisar
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK debug
        working-directory: android
        run: bash ./gradlew --no-daemon assembleRenderDebug assembleHostlessDebug

      - name: Publicar APK descargables
        uses: actions/upload-artifact@v7
        with:
          name: apk-android-debug
          path: |
            android/app/build/outputs/apk/render/debug/app-render-debug.apk
            android/app/build/outputs/apk/hostless/debug/app-hostless-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
